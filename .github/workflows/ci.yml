name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: ./scripts/doctor.sh --syntax
      - run: python3 -m unittest discover -s tests -v
      - run: find scripts skills -name '*.sh' -print0 | xargs -0 shellcheck
      - run: node --check overlay/app.js
      - run: node tests/overlay.test.cjs
      - run: python3 scripts/check-test-coverage.py
      - run: python3 scripts/eval-status.py
      - run: python3 scripts/check-control-plane.py
